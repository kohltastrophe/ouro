ib-24 and 250 KiB).</text><text x="0" y="355" class="tm s95">Faded bars exceed 10× (true multiple labeled) · Ouro (guarded) sets instructionLimit = 50M; Fiu sets errorHandling = false, reuseClosures = true, useImportConstants = true.</text><text x="0" y="369" class="tm s95">LuauCeption errors on pcall-2k (Infinity), so its VM geomean covers the 12 workloads it completes · ±10% run-to-run noise.</text></svg>
