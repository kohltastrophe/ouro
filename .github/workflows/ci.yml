name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Lint, Test, Coverage & Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Conventional Commits and version check
        uses: kohltastrophe/release@v1
        with:
          mode: check

      - uses: kohltastrophe/sert/actions/setup@v0.3.0

      - name: Test update tooling
        run: python3 -m unittest discover -s tools/tests -v

      - name: sert lint
        run: python3 tools/sert.py lint

      - name: sert run
        run: python3 tools/sert.py run --coverage --compact

      - name: Standalone Luau (codegen & type API)
        run: |
          luau --codegen tests/run.luau -a --compact
          luau tests/types/Api.luau

      - name: sert coverage
        run: python3 tools/sert.py coverage --badge

      - name: Package checks
        run: |
          mkdir -p build
          rojo build default.project.json --output build/Ouro.rbxm
          wally package --list
          wally package --output "$RUNNER_TEMP/wally.zip"
          size=$(stat -c %s "$RUNNER_TEMP/wally.zip")
          echo "Wally package: $size bytes (the registry refuses more than 2 MiB)"
          [ "$size" -le 2097152 ]
          python3 .github/scripts/publish_pesde.py

      - name: Differential, conformance & fuzz checks
        run: |
          python3 tools/fetch_upstream.py --output "$RUNNER_TEMP/luau-source"
          python3 tools/check.py --upstream "$RUNNER_TEMP/luau-source" --build-dir "$RUNNER_TEMP/oracle" --report-dir "$RUNNER_TEMP/conformance"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: coverage-badge
          path: coverage.json
          if-no-files-found: error
          overwrite: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: conformance
          path: ${{ runner.temp }}/conformance
          if-no-files-found: warn

  cloud:
    name: Roblox (Open Cloud)
    needs: check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: testing
    timeout-minutes: 30
    concurrency:
      group: luau-execution
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: kohltastrophe/sert/actions/setup@v0.3.0

      - name: sert cloud
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID || secrets.ROBLOX_TEST_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID || secrets.ROBLOX_TEST_PLACE_ID }}
        run: python3 tools/sert.py cloud

  badge:
    name: Update Coverage Badge
    needs: [check, cloud]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: badges
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-badge

      - name: Commit coverage.json onto badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          parent=""
          if git ls-remote --exit-code --heads origin badges > /dev/null; then
            git fetch --no-tags origin refs/heads/badges:refs/heads/badges
            parent="-p refs/heads/badges"
          fi
          blob=$(git hash-object -w coverage.json)
          tree=$(printf '100644 blob %s\tcoverage.json\n' "$blob" | git mktree)
          if [ -z "$parent" ] || [ "$(git rev-parse refs/heads/badges^{tree})" != "$tree" ]; then
            msg=$(python3 -c 'import json; print("badge: coverage " + json.load(open("coverage.json"))["message"])')
            commit=$(git commit-tree "$tree" $parent -m "$msg")
            git push origin "$commit:refs/heads/badges"
          fi
